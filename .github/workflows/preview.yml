name: preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  # A merged PR's events carry the base branch as github.ref, so key PR runs by number.
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    uses: compliance-framework/workflows/.github/workflows/preview.yml@db831b1482515a9c4e7d200154afa09789bd0577 # v1.8.1
    with:
      kind: policies
      on-main: false
    permissions:
      contents: read
      packages: write
